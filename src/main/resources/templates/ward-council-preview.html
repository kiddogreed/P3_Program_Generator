<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ward Council Meeting Preview')}">
    <style>
        .preview-wrapper { max-width: 760px; margin: 30px auto; }

        .wc-preview {
            background: white; border: 1px solid #c8d8e8;
            border-radius: 12px; box-shadow: 0 4px 24px rgba(44,82,130,0.12); overflow: hidden;
        }

        /* Header band */
        .wc-header-band {
            background: #fdf9f5; border-bottom: 3px solid #d2691e;
            text-align: center; padding: 22px 24px 18px;
        }
        .header-lds-logo { max-width: 60px; margin-bottom: 10px; }
        .church-name { font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: #5c360c; margin-bottom: 10px; }
        .wc-ward-name { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; line-height: 1.25; color: #5c360c; margin-bottom: 4px; }
        .wc-title-band { font-size: 12px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #2c5282; margin-bottom: 14px; }
        .header-divider { width: 60px; height: 2px; background: #d2691e; margin: 0 auto 10px; border-radius: 1px; }
        .header-date { font-size: 12px; letter-spacing: 1px; color: #4a5568; }

        /* Content */
        .wc-content { padding: 28px 32px 24px; }

        .agenda-bar {
            display: flex; align-items: baseline; justify-content: space-between;
            border-bottom: 2px solid #d2691e; margin-bottom: 18px; padding-bottom: 6px;
        }
        .agenda-label { font-size: 18px; font-weight: 700; color: #d2691e; }
        .agenda-date  { font-size: 14px; font-weight: 600; color: #d2691e; }

        .meeting-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        .meeting-table th {
            width: 38%; background: #f4ede3; color: #5a3e1b;
            font-size: 13px; font-weight: 700; text-align: left;
            padding: 9px 14px; border: 1px solid #ddd0bb;
        }
        .meeting-table td {
            color: #1e293b; font-size: 13px; padding: 9px 14px;
            border: 1px solid #ddd0bb; vertical-align: top;
        }
        .meeting-table tr:nth-child(even) td { background: #fafbff; }

        /* Agenda nested */
        .agenda-item-title { font-weight: 600; color: #1e293b; }
        .agenda-item-detail { font-size: 12px; color: #4a5568; line-height: 1.5; padding-left: 14px; }

        /* Footer logo */
        .wc-footer-band {
            background: #f7f9fc; border-top: 1px solid #c8d8e8;
            text-align: center; padding: 12px 24px;
        }
        .footer-logo { max-width: 70px; opacity: 0.75; }

        /* Action bar */
        .action-bar {
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
            padding: 18px 32px 22px; border-top: 1px solid #e2e8f0; background: #f7f9fc;
        }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
        .btn-primary { background: linear-gradient(135deg,#5a8aaa,#8b7355); color: white; }
        .btn-secondary { background: white; color: #5a8aaa; border: 1.5px solid #c8d8e8; }
        .btn-secondary:hover { background: #f0f5fb; }

        @media (max-width: 680px) { .preview-wrapper { margin: 12px 8px; } .wc-content { padding: 18px 16px; } .action-bar { padding: 14px 16px; } }
    </style>
</head>
<body>
    <nav th:replace="~{layout :: navigation('wardcouncil')}"></nav>

    <main class="main-content">
        <div class="container">
            <div class="preview-wrapper">

                <div class="wc-preview">

                    <!-- Header band -->
                    <div class="wc-header-band">
                        <img th:src="@{/images/LDS_LOGO_wbg.png}" alt="LDS Logo" class="header-lds-logo"
                             onerror="this.style.display='none'">
                        <div class="church-name">The Church of Jesus Christ of Latter-day Saints</div>
                        <div class="wc-ward-name" th:text="${wardCouncilProgram.wardName}">Pasay 3rd</div>
                        <div class="header-divider"></div>
                        <div class="wc-title-band">Ward Council Meeting</div>
                        <div class="header-date" th:text="${#temporals.format(wardCouncilProgram.meetingDate, 'MMMM d, yyyy')}"></div>
                    </div>

                    <!-- Meeting content -->
                    <div class="wc-content">
                        <div class="agenda-bar">
                            <span class="agenda-label">Agenda</span>
                            <span class="agenda-date" th:text="${#temporals.format(wardCouncilProgram.meetingDate, 'MM-dd-yy')}"></span>
                        </div>

                        <table class="meeting-table">
                            <tr th:if="${wardCouncilProgram.presiding != null and !wardCouncilProgram.presiding.isEmpty()}">
                                <th>Presiding</th>
                                <td th:text="${wardCouncilProgram.presiding}"></td>
                            </tr>
                            <tr th:if="${wardCouncilProgram.conducting != null and !wardCouncilProgram.conducting.isEmpty()}">
                                <th>Conducting</th>
                                <td th:text="${wardCouncilProgram.conducting}"></td>
                            </tr>
                            <tr th:if="${wardCouncilProgram.openingPrayer != null and !wardCouncilProgram.openingPrayer.isEmpty()}">
                                <th>Opening Prayer</th>
                                <td th:text="${wardCouncilProgram.openingPrayer}"></td>
                            </tr>
                            <tr th:if="${wardCouncilProgram.handbookReading != null and !wardCouncilProgram.handbookReading.isEmpty()}">
                                <th>Handbook Reading / Scriptural Thought</th>
                                <td th:text="${wardCouncilProgram.handbookReading}"></td>
                            </tr>
                            <tr th:if="${agendaItemsList != null and !agendaItemsList.isEmpty()}">
                                <th>Agenda Items</th>
                                <td>
                                    <div th:each="item, iStat : ${agendaItemsList}" style="margin-bottom:8px;">
                                        <div class="agenda-item-title">
                                            <span th:text="${iStat.index + 1} + '. '"></span><span th:text="${item.title}"></span>
                                        </div>
                                        <div th:if="${item.details != null and !item.details.isEmpty()}" class="agenda-item-detail">
                                            <div th:each="det : ${item.details}">
                                                &bull; <span th:text="${det}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${wardCouncilProgram.welfare != null and !wardCouncilProgram.welfare.isEmpty()}">
                                <th>Welfare</th>
                                <td th:text="${wardCouncilProgram.welfare}"></td>
                            </tr>
                            <tr th:if="${wardCouncilProgram.closingPrayer != null and !wardCouncilProgram.closingPrayer.isEmpty()}">
                                <th>Closing Prayer</th>
                                <td th:text="${wardCouncilProgram.closingPrayer}"></td>
                            </tr>
                        </table>
                    </div>

                    <!-- Footer logo band -->
                    <div class="wc-footer-band">
                        <img th:src="@{/images/P3_LOGO.png}" alt="Ward Logo" class="footer-logo"
                             onerror="this.style.display='none'">
                    </div>

                    <!-- Action bar -->
                    <div class="action-bar">
                        <form th:action="@{/ward-council/export/png}" method="post" style="display:contents;">
                            <input type="hidden" name="wardName"       th:value="${wardCouncilProgram.wardName}">
                            <input type="hidden" name="meetingDate"    th:value="${wardCouncilProgram.meetingDate}">
                            <input type="hidden" name="presiding"      th:value="${wardCouncilProgram.presiding}">
                            <input type="hidden" name="conducting"     th:value="${wardCouncilProgram.conducting}">
                            <input type="hidden" name="openingPrayer"  th:value="${wardCouncilProgram.openingPrayer}">
                            <input type="hidden" name="handbookReading" th:value="${wardCouncilProgram.handbookReading}">
                            <input type="hidden" name="auxiliary"      th:value="${wardCouncilProgram.auxiliary}">
                            <input type="hidden" name="welfare"        th:value="${wardCouncilProgram.welfare}">
                            <input type="hidden" name="closingPrayer"  th:value="${wardCouncilProgram.closingPrayer}">
                            <input type="hidden" name="agendaItemsJson" th:value="${agendaItemsJson}">
                            <button type="submit" class="btn btn-primary">&#11015; Export to PNG</button>
                        </form>
                        <form th:action="@{/ward-council/edit}" method="post" style="display:contents;">
                            <input type="hidden" name="wardName"       th:value="${wardCouncilProgram.wardName}">
                            <input type="hidden" name="meetingDate"    th:value="${wardCouncilProgram.meetingDate}">
                            <input type="hidden" name="presiding"      th:value="${wardCouncilProgram.presiding}">
                            <input type="hidden" name="conducting"     th:value="${wardCouncilProgram.conducting}">
                            <input type="hidden" name="openingPrayer"  th:value="${wardCouncilProgram.openingPrayer}">
                            <input type="hidden" name="handbookReading" th:value="${wardCouncilProgram.handbookReading}">
                            <input type="hidden" name="auxiliary"      th:value="${wardCouncilProgram.auxiliary}">
                            <input type="hidden" name="welfare"        th:value="${wardCouncilProgram.welfare}">
                            <input type="hidden" name="closingPrayer"  th:value="${wardCouncilProgram.closingPrayer}">
                            <input type="hidden" name="agendaItemsJson" th:value="${agendaItemsJson}">
                            <button type="submit" class="btn btn-secondary">&#9998; Edit Program</button>
                        </form>
                    </div>

                </div><!-- .wc-preview -->
            </div><!-- .preview-wrapper -->
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
