<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Sacrament Meeting Program')"></head>
<body>
    <nav th:replace="layout :: navigation('sacrament')"></nav>

    <main class="main-content">
        <div class="container">
            <h1>Sacrament Meeting Program</h1>

            <div th:if="${successMessage}" class="alert alert-success" role="alert"
                 th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" role="alert"
                 th:text="${errorMessage}"></div>
            
            <div class="program-form">
                <form class="meeting-form" th:action="@{/sacrament/preview}" method="post" th:object="${sacramentProgram}">
                    <div class="form-section">
                        <h3>Ward Information</h3>
                        <div class="form-group">
                            <label for="stakeName">Stake Name:</label>
                            <input type="text" id="stakeName" th:field="*{stakeName}" placeholder="e.g., Pasay Philippines Stake">
                        </div>
                        <div class="form-group">
                            <label for="wardName">Ward Name:</label>
                            <input type="text" id="wardName" th:field="*{wardName}" placeholder="e.g., Pasay 3rd Ward">
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Meeting Details</h3>
                        <div class="form-group">
                            <label for="date">Date:</label>
                            <input type="date" id="date" th:field="*{date}" required>
                        </div>
                        <div class="form-group">
                            <label for="presiding">Presiding:</label>
                            <input type="text" id="presiding" th:field="*{presiding}" placeholder="Bishop Name">
                        </div>
                        <div class="form-group">
                            <label for="conducting">Conducted by:</label>
                            <select id="conducting" th:field="*{conducting}" style="width:100%;">
                                <option value="">Select Conductor</option>
                                <option th:each="c : ${conductors}"
                                        th:value="${c.name}"
                                        th:text="${c.name}">
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="acknowledgement">Acknowledgement: <span class="char-limit">(max 400 characters)</span></label>
                            <textarea id="acknowledgement" th:field="*{acknowledgement}" rows="2" maxlength="400" placeholder="Acknowledgement text (optional)" 
                                     oninput="updateCharCount('acknowledgement', 400)"></textarea>
                            <small class="char-count" id="acknowledgement-count">0/400 characters</small>
                        </div>
                        <div class="form-group">
                            <label for="announcements">Announcements: <span class="char-limit">(max 400 characters)</span></label>
                            <textarea id="announcements" name="announcements" rows="4" maxlength="400" th:text="${announcementsText}" 
                                     placeholder="Enter announcements here, one per line or separated by commas (optional)"
                                     oninput="updateCharCount('announcements', 400)"></textarea>
                            <small class="char-count" id="announcements-count">0/400 characters</small>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Music</h3>
                        <div class="form-group">
                            <label for="chorister">Chorister:</label>
                            <select id="chorister" th:field="*{chorister}" style="width:100%;">
                                <option value="">Select Chorister</option>
                                <option th:each="m : ${choristers}"
                                        th:value="${m.name}"
                                        th:text="${m.name}">
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="pianist">Pianist:</label>
                            <select id="pianist" th:field="*{pianist}" style="width:100%;">
                                <option value="">Select Pianist</option>
                                <option th:each="m : ${pianists}"
                                        th:value="${m.name}"
                                        th:text="${m.name}">
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="openingHymn">Opening Hymn:</label>
                            <input type="text" id="openingHymn" th:field="*{openingHymn}" placeholder="Hymn #274 - 'The Iron Rod'">
                        </div>
                        <div class="form-group">
                            <label for="sacramentHymn">Sacrament Hymn:</label>
                            <input type="text" id="sacramentHymn" th:field="*{sacramentHymn}" placeholder="Hymn #191 - 'Behold the Great redeemer Die'">
                        </div>
                        <div class="form-group">
                            <label for="closingHymn">Closing Hymn:</label>
                            <input type="text" id="closingHymn" th:field="*{closingHymn}" placeholder="Hymn #85 - 'How Firm a Foundation'">
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Program</h3>
                        <div class="form-group">
                            <label for="invocation">Invocation:</label>
                            <input type="text" id="invocation" th:field="*{invocation}" placeholder="Member Name">
                        </div>
                        <div class="form-group">
                            <label for="wardBusiness">Ward Business: <span class="char-limit">(max 400 characters)</span></label>
                            <textarea id="wardBusiness" th:field="*{wardBusiness}" rows="4" maxlength="400" 
                                     placeholder="Ward business items (optional)&#10;Press Enter for new lines to add multiple items"
                                     oninput="updateCharCount('wardBusiness', 400)"></textarea>
                            <small class="char-count" id="wardBusiness-count">0/400 characters</small>
                        </div>
                        <div class="form-group">
                            <label for="stakeBusiness">Stake Business: <span class="char-limit">(max 300 characters for 1 line only)</span></label>
                            <textarea id="stakeBusiness" th:field="*{stakeBusiness}" rows="1" maxlength="300" 
                                     placeholder="Stake business items (optional) - single line only"
                                     oninput="updateCharCount('stakeBusiness', 300)"></textarea>
                            <small class="char-count" id="stakeBusiness-count">0/300 characters</small>
                        </div>
                        <div class="form-group">
                            <label for="benediction">Benediction:</label>
                            <input type="text" id="benediction" th:field="*{benediction}" placeholder="Member Name">
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Speakers
                            <span th:if="${speakerTypeHint != null}"
                                  style="font-size:12px;font-weight:600;background:#e0f2fe;color:#0369a1;
                                         padding:3px 10px;border-radius:12px;margin-left:10px;vertical-align:middle;"
                                  th:text="${speakerTypeHint}"></span>
                        </h3>
                        <div class="form-group">
                            <label for="speakersAuxiliary">Speakers Auxiliary:</label>
                            <select id="speakersAuxiliary" name="speakersAuxiliary" th:field="*{speakersAuxiliary}">
                                <option value="">Select Auxiliary</option>
                                <option th:each="aux : ${auxiliaries}"
                                    th:value="${aux.name}"
                                    th:text="${aux.name}"></option>
                            </select>
                        </div>

                        <div id="speakersContainer">
                            <!-- Speaker rows injected by JS -->
                        </div>

                        <div style="margin-top:8px;">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="addSpeaker()" id="addSpeakerBtn">+ Add Speaker</button>
                            <small id="speakerLimitNote" style="color:#718096;margin-left:8px;"></small>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Preview Program</button>
                        <button type="reset" class="btn btn-secondary">Clear Form</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="layout :: footer"></footer>

    <script th:inline="javascript">
        // ── Character counter ──────────────────────────────────────────────
        function updateCharCount(fieldId, maxLength) {
            const field = document.getElementById(fieldId);
            const countEl = document.getElementById(fieldId + '-count');
            if (!field || !countEl) return;
            const len = field.value.length;
            countEl.textContent = len + '/' + maxLength + ' characters';
            countEl.style.color = len > maxLength * 0.9 ? '#e53e3e'
                                 : len > maxLength * 0.8 ? '#dd6b20' : '#4a5568';
        }

        // ── Dynamic speakers ───────────────────────────────────────────────
        const MAX_SPEAKERS = 7;
        const DEFAULT_SPEAKERS = 3;

        // Initial data from server (empty list on new form; populated on edit/history load)
        const initialSpeakerNames   = /*[[${speakerNames}]]*/ [];
        const initialSpeakerTitles  = /*[[${speakerTitles}]]*/ [];

        const ordinals = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th'];

        function buildSpeakerRow(index, name, title) {
            const ord = ordinals[index] || (index + 1) + 'th';
            const div = document.createElement('div');
            div.className = 'speaker-row';
            div.style.cssText = 'display:flex;align-items:flex-end;gap:8px;margin-bottom:8px;';

            // Title select
            const titleWrap = document.createElement('div');
            titleWrap.className = 'form-group';
            titleWrap.style.flex = '0 0 140px';
            const titleLabel = document.createElement('label');
            titleLabel.textContent = ord + ' Speaker Title:';
            const titleSel = document.createElement('select');
            titleSel.name = 'speakerTitles';
            titleSel.innerHTML = '<option value="">Title</option>'
                + ['Bro.', 'Sis.'].map(t =>
                    `<option value="${t}"${title === t ? ' selected' : ''}>${t}</option>`
                ).join('');
            titleWrap.appendChild(titleLabel);
            titleWrap.appendChild(titleSel);

            // Name input
            const nameWrap = document.createElement('div');
            nameWrap.className = 'form-group';
            nameWrap.style.flex = '1';
            const nameLabel = document.createElement('label');
            nameLabel.textContent = ord + ' Speaker Name:';
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.name = 'speakerNames';
            nameInput.value = name || '';
            nameInput.placeholder = ord + ' Speaker Name';
            nameInput.maxLength = 100;
            nameWrap.appendChild(nameLabel);
            nameWrap.appendChild(nameInput);

            div.appendChild(titleWrap);
            div.appendChild(nameWrap);

            // Remove button (never shown for the first row)
            if (index > 0) {
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn btn-sm btn-danger';
                removeBtn.textContent = '✕';
                removeBtn.style.cssText = 'flex:0 0 auto;margin-bottom:2px;';
                removeBtn.onclick = function () {
                    div.remove();
                    renumberSpeakers();
                    updateSpeakerAddButton();
                };
                div.appendChild(removeBtn);
            }

            return div;
        }

        function renumberSpeakers() {
            const rows = document.querySelectorAll('#speakersContainer .speaker-row');
            rows.forEach((row, i) => {
                const ord = ordinals[i] || (i + 1) + 'th';
                const labels = row.querySelectorAll('label');
                if (labels[0]) labels[0].textContent = ord + ' Speaker Title:';
                if (labels[1]) labels[1].textContent = ord + ' Speaker Name:';
                const nameInput = row.querySelector('input[name="speakerNames"]');
                if (nameInput) nameInput.placeholder = ord + ' Speaker Name';
            });
        }

        function updateSpeakerAddButton() {
            const count = document.querySelectorAll('#speakersContainer .speaker-row').length;
            const btn = document.getElementById('addSpeakerBtn');
            const note = document.getElementById('speakerLimitNote');
            if (count >= MAX_SPEAKERS) {
                btn.disabled = true;
                note.textContent = 'Maximum ' + MAX_SPEAKERS + ' speakers reached.';
            } else {
                btn.disabled = false;
                note.textContent = '';
            }
        }

        function addSpeaker() {
            const count = document.querySelectorAll('#speakersContainer .speaker-row').length;
            if (count >= MAX_SPEAKERS) return;
            const container = document.getElementById('speakersContainer');
            container.appendChild(buildSpeakerRow(count, '', ''));
            updateSpeakerAddButton();
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Character counters
            updateCharCount('acknowledgement', 400);
            updateCharCount('announcements', 400);
            updateCharCount('wardBusiness', 400);
            updateCharCount('stakeBusiness', 300);

            // Initialise speaker rows
            const container = document.getElementById('speakersContainer');
            const count = Math.max(initialSpeakerNames.length, DEFAULT_SPEAKERS);
            for (let i = 0; i < count; i++) {
                container.appendChild(buildSpeakerRow(i,
                    initialSpeakerNames[i] || '',
                    initialSpeakerTitles[i] || ''));
            }
            updateSpeakerAddButton();

            // Auto-update acknowledgement when conductor changes
            const ackTemplate = /*[[${acknowledgementTemplate}]]*/ '';
            const conductorNames = /*[[${conductors.![name]}]]*/ [];
            const conductingSelect = document.getElementById('conducting');
            function refreshAcknowledgement() {
                if (!ackTemplate) return;
                const chosen = conductingSelect.value;
                const others = conductorNames.filter(n => n !== chosen).join(', ');
                let ack = ackTemplate.replace('{OTHER_CONDUCTORS}', others);
                // Remove unresolved bishopric placeholder for now
                ack = ack.replace('{BISHOPRIC_OTHERS}', '');
                const ackField = document.getElementById('acknowledgement');
                if (ackField && (!ackField.dataset.userEdited || ackField.dataset.userEdited === 'false')) {
                    ackField.value = ack;
                    updateCharCount('acknowledgement', 400);
                }
            }
            if (conductingSelect) {
                conductingSelect.addEventListener('change', refreshAcknowledgement);
                // Mark as user-edited once they type manually
                const ackField = document.getElementById('acknowledgement');
                if (ackField) {
                    ackField.addEventListener('input', function() {
                        this.dataset.userEdited = 'true';
                        updateCharCount('acknowledgement', 400);
                    });
                }
                // Run once on load to ensure consistency
                refreshAcknowledgement();
            }
        });
    </script>
</body>
</html>
